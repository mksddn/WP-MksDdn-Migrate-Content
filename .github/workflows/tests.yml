name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run unit tests
        run: composer test:unit

  integration:
    name: Integration (PHP 8.1 + MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip, mbstring, mysqli
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      - name: Install WordPress test suite
        env:
          WP_TESTS_DIR: ${{ github.workspace }}/tmp/wordpress-tests-lib
          WP_CORE_DIR: ${{ github.workspace }}/tmp/wordpress
        run: |
          bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 7.1 true
      - name: Run integration tests
        env:
          WP_TESTS_DIR: ${{ github.workspace }}/tmp/wordpress-tests-lib
          WP_CORE_DIR: ${{ github.workspace }}/tmp/wordpress
        run: composer test:integration

  php74-lint:
    name: PHP 7.4 syntax lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Lint plugin PHP files
        run: |
          find mksddn-migrate-content/trunk -name '*.php' -print0 \
            | xargs -0 -n1 php -l
